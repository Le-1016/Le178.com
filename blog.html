  <style>
    .blog-page { min-height: 100vh; padding: 150px 7vw 120px; position: relative; z-index: 2; }
    .blog-title { margin: 0 0 16px; color: var(--red); font-family: "Orbitron", sans-serif; font-size: clamp(48px, 7vw, 96px); font-weight: 800; letter-spacing: .08em; }
    .blog-lead { max-width: 760px; margin: 0 0 82px; color: var(--white); line-height: 2; opacity: .8; }
    .blog-list { max-width: 1080px; margin: 0 auto; }
    .blog-post { position: relative; padding: clamp(34px, 5vw, 64px); border: 1px solid rgba(229,34,34,.22); background: linear-gradient(135deg, rgba(13,13,13,.97), rgba(7,7,7,.97)); overflow: hidden; }
    .blog-post::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--red); }
    .blog-meta { margin: 0 0 18px; color: var(--red-bright); font-family: "Orbitron", sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .13em; }
    .blog-post-title { margin: 0 0 34px; color: var(--white); font-family: "Noto Serif JP", "Yu Mincho", "Hiragino Mincho ProN", serif; font-size: clamp(28px, 4.2vw, 48px); line-height: 1.5; letter-spacing: .03em; }
    .blog-body { max-width: 820px; }
    .blog-body p { margin: 0; color: var(--white); font-family: "Noto Serif JP", "Yu Mincho", "Hiragino Mincho ProN", serif; font-size: clamp(15px,1.35vw,17px); line-height: 2.2; opacity: .82; }
    .blog-body p + p { margin-top: 1.5em; }
    nav a.active { color: var(--red-bright); text-shadow: 0 0 10px rgba(229,34,34,.45); }
    header .logo { color: var(--white) !important; text-shadow: none !important; }
    header .logo span { color: var(--red) !important; }
    header nav a, header nav a.active { color: var(--white) !important; text-shadow: none !important; }
    header nav a:hover, header nav a.active:hover { color: var(--red-bright) !important; }
    @media (max-width: 760px) {
      .blog-page { padding: 130px 7vw 90px; }
      .blog-lead { margin-bottom: 52px; }
      .blog-post { padding: 30px 24px 36px; }
    }
  </style>

    <h1 class="blog-title">BLOG</h1>
    <p class="blog-lead">活動・登壇・学習・制作などの記録を掲載しています。</p>

    <div class="blog-list">
      <article class="blog-post">
        <p class="blog-meta">2026/7/26 SUN</p>
        <h2 class="blog-post-title">感謝状を頂きました。</h2>
        <div class="blog-body">
          <p>　本日、インテックス大阪で開催された「大阪府公立高校進学フェア2027」の高校生トークセッションにて、大阪公立大高専の学生代表として登壇しました。</p>
          <p>　ステージでは、中学生や保護者に向けて、高校と高専の違い、実際の学校生活、専門的な勉強の魅力について自身の経験を交えて発表しました。</p>
          <p>　後日、大阪府教育庁から感謝状をいただきました。</p>
        </div>
      </article>
    </div>
