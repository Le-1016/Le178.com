        <div class="blog-body">
          <p>　本日、インテックス大阪で開催された「大阪府公立高校進学フェア2027」の高校生トークセッションにて、大阪公立大高専の学生代表として登壇しました。</p>
          <p>　ステージでは、中学生や保護者に向けて、高校と高専の違い、実際の学校生活、専門的な勉強の魅力について自身の経験を交えて発表しました。</p>
          <p>　後日、大阪府教育庁から感謝状をいただきました。</p>
