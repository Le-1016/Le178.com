services:
  lab:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://lab_user:lab_password@postgres:5432/lab_db
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: lab_db
      PGUSER: lab_user
      PGPASSWORD: lab_password
    volumes:
      - .:/workspace:cached
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: lab_db
      POSTGRES_USER: lab_user
      POSTGRES_PASSWORD: lab_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_user -d lab_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres-data:
