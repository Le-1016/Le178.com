<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EXPERIENCE｜LEON INABA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700;800;900&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260903-0615">
  <link rel="stylesheet" href="japanese-theme.css?v=20260905-0622">
  <style>
    .experience-page {
      min-height: 100vh;
      padding: 150px 7vw 120px;
      position: relative;
      z-index: 2;
    }

    .experience-title {
      margin: 0 0 16px;
      color: var(--red);
      font-family: "Orbitron", sans-serif;
      font-size: clamp(42px, 6.5vw, 88px);
      font-weight: 800;
      letter-spacing: 0.07em;
    }

    .experience-lead {
      max-width: 780px;
      margin: 0 0 82px;
      color: var(--white);
      line-height: 2;
      opacity: 0.8;
    }

    .experience-list {
      max-width: 1100px;
      margin: 0 auto;
    }

    .experience-card {
      position: relative;
      min-height: 310px;
      padding: clamp(38px, 5vw, 62px);
      border: 1px solid rgba(229, 34, 34, 0.22);
      background: linear-gradient(135deg, rgba(13,13,13,0.96), rgba(7,7,7,0.96));
      overflow: hidden;
    }

    .experience-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 2px;
      background: var(--red);
      transition: width 1s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .experience-card.is-visible::before { width: 100%; }

    .experience-status {
      position: absolute;
      top: 22px;
      right: 22px;
      padding: 8px 12px;
      border: 1px solid rgba(229, 34, 34, 0.58);
      color: var(--red-bright);
      background: rgba(229, 34, 34, 0.055);
      font-family: "Orbitron", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .experience-kicker {
      margin: 0 0 18px;
      color: var(--red);
      font-family: "Orbitron", sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.17em;
    }

    .experience-card h2 {
      max-width: 820px;
      margin: 0 0 24px;
      padding-right: 90px;
      color: var(--white);
      font-family: "Noto Serif JP", "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: clamp(25px, 3.2vw, 42px);
      font-weight: 700;
      line-height: 1.6;
      letter-spacing: 0.02em;
    }

    .experience-card p {
      max-width: 820px;
      margin: 0;
      color: var(--white);
      font-size: 15px;
      line-height: 2;
      opacity: 0.76;
    }

    .motion-ready .experience-card .experience-kicker,
    .motion-ready .experience-card h2,
    .motion-ready .experience-card p,
    .motion-ready .experience-card .experience-status {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.68s ease, transform 0.82s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .motion-ready .experience-card .experience-status {
      transform: translateY(-12px);
      transition-delay: 0.08s;
    }

    .motion-ready .experience-card h2 { transition-delay: 0.08s; }
    .motion-ready .experience-card p { transition-delay: 0.16s; }

    .motion-ready .experience-card.is-visible .experience-kicker,
    .motion-ready .experience-card.is-visible h2,
    .motion-ready .experience-card.is-visible p,
    .motion-ready .experience-card.is-visible .experience-status {
      opacity: 1;
      transform: none;
    }

    nav a.active {
      color: var(--red-bright);
      text-shadow: 0 0 10px rgba(229,34,34,0.45);
    }
    header .logo { color: var(--white) !important; text-shadow: none !important; }
    header .logo span { color: var(--red) !important; }
    header nav a,
    header nav a.active { color: var(--white) !important; text-shadow: none !important; }
    header nav a:hover,
    header nav a.active:hover { color: var(--red-bright) !important; }

    @media (max-width: 760px) {
      .experience-page { padding: 130px 7vw 90px; }
      .experience-lead { margin-bottom: 52px; }
      .experience-card { padding: 74px 26px 38px; min-height: 0; }
      .experience-status { top: 20px; right: 20px; }
      .experience-card h2 { padding-right: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .experience-card::before { width: 100%; transition: none; }
      .motion-ready .experience-card .experience-kicker,
      .motion-ready .experience-card h2,
      .motion-ready .experience-card p,
      .motion-ready .experience-card .experience-status {
        opacity: 1;
        transform: none;
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true"><div class="grid"></div><div class="glow glow-1"></div><div class="glow glow-2"></div></div>

  <header>
    <a href="index.html" class="logo"><span>Le</span>PORTFOLIO<span>.</span></a>
    <nav>
      <a href="skill.html">SKILL</a>
      <a href="index.html#activity">BLOG</a>
      <a href="certification.html">CERTIFICATION</a>
      <a href="experience.html" class="active">EXPERIENCE</a>
      <a href="career.html">CAREER</a>
    </nav>
  </header>

  <main class="experience-page">
    <h1 class="experience-title">EXPERIENCE</h1>
    <p class="experience-lead">授業・制作・プロジェクトなどを通して取り組んでいる実践経験をまとめています。</p>

    <div class="experience-list">
      <section class="experience-card">
        <div class="experience-status">Ongoing</div>
        <p class="experience-kicker">UNREAL ENGINE / DIGITAL ARCHIVE</p>
        <h2>Unreal Engineを用いた寝屋川キャンパスのデジタルアーカイブ制作</h2>
        <p>Unreal Engineを用いて、寝屋川キャンパスをデジタル空間上に記録・再現する制作に取り組んでいます。</p>
      </section>
    </div>
  </main>

  <script>
    (() => {
      const card = document.querySelector('.experience-card');
      if (!card) return;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduceMotion) document.documentElement.classList.add('motion-ready');
      if (reduceMotion || !('IntersectionObserver' in window)) {
        card.classList.add('is-visible');
        return;
      }
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        });
      }, { threshold: 0.25, rootMargin: '0px 0px -8% 0px' });
      observer.observe(card);
    })();
  </script>
</body>
</html>
