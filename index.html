<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEON INABA｜PORTFOLIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700;800;900&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260903-0615">
  <link rel="stylesheet" href="japanese-theme.css?v=20260905-0622">
  <style>
    header .logo {
      color: var(--white) !important;
      text-shadow: none !important;
    }
    header .logo span {
      color: var(--red) !important;
    }
    header nav a,
    header nav a.active {
      color: var(--white) !important;
      text-shadow: none !important;
    }
    header nav a:hover,
    header nav a.active:hover {
      color: var(--red-bright) !important;
    }

    .contact { padding-top: 90px; padding-bottom: 120px; }
    .contact-box {
      max-width: 1080px;
      margin: 0 auto;
      padding: clamp(34px, 5vw, 58px);
      border: 1px solid rgba(229,34,34,.24);
      background: linear-gradient(135deg, rgba(13,13,13,.96), rgba(7,7,7,.96));
    }
    .contact-copy {
      margin: 0 0 28px;
      color: var(--white);
      font-size: 15px;
      line-height: 2;
      opacity: .78;
    }
    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 22px;
      border: 1px solid rgba(229,34,34,.55);
      color: var(--white);
      background: rgba(229,34,34,.08);
      font-family: "Noto Serif JP", serif;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: .06em;
      transition: .25s ease;
    }
    .contact-link:hover {
      color: var(--red-bright);
      border-color: var(--red);
      transform: translateY(-2px);
    }

    .profile { position: relative; }
    .profile-box {
      position: relative;
      max-width: 1080px;
      min-height: 360px;
      margin: 0 auto;
      padding: clamp(34px, 5vw, 64px);
      border: 1px solid rgba(229, 34, 34, 0.2);
      background: linear-gradient(135deg, rgba(13,13,13,0.96), rgba(7,7,7,0.96));
      overflow: hidden;
    }
    .profile-box::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--red);
      transition: width 1s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .profile-box::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 2px;
      height: 0;
      background: var(--red);
      transition: height 1s cubic-bezier(0.22, 1, 0.36, 1) 0.12s;
    }
    .profile.is-visible .profile-box::before { width: 100%; }
    .profile.is-visible .profile-box::after { height: 100%; }
    .profile-grid { display: grid; gap: 0; }
    .profile-row {
      display: grid;
      grid-template-columns: 120px 1fr;
      align-items: baseline;
      gap: 24px;
      padding: 24px 0;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      opacity: 0;
      transform: translateY(26px);
      transition: opacity 0.7s ease, transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .profile-row:last-child { border-bottom: 0; }
    .profile-row:nth-child(2) { transition-delay: 0.12s; }
    .profile-row:nth-child(3) { transition-delay: 0.24s; }
    .profile-row:nth-child(4) { transition-delay: 0.36s; }
    .profile.is-visible .profile-row { opacity: 1; transform: translateY(0); }
    .profile-label {
      color: var(--red);
      font-family: "Orbitron", sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.16em;
    }
    .profile-value {
      color: var(--white);
      font-family: "Noto Serif JP", "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: clamp(22px, 3vw, 36px);
      font-weight: 700;
      line-height: 1.55;
      letter-spacing: 0.04em;
    }
    .school-pair {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: clamp(18px, 3vw, 42px);
      align-items: start;
    }
    .school-ja { min-width: 0; }
    .school-ja {
      font-size: clamp(15px, 1.55vw, 21px);
      line-height: 1.85;
      letter-spacing: 0.015em;
    }
    @media (max-width: 700px) {
      .profile-row { grid-template-columns: 1fr; gap: 8px; padding: 20px 0; }
      .school-pair { grid-template-columns: 1fr; gap: 14px; }
      .school-ja { font-size: clamp(14px, 4.2vw, 18px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .profile-box::before { width: 100%; transition: none; }
      .profile-box::after { height: 100%; transition: none; }
      .profile-row { opacity: 1; transform: none; transition: none; }
    }
  </style>
  <link rel="stylesheet" href="responsive.css?v=20261008">
</head>
<body>
  <div class="background" aria-hidden="true">
    <div class="grid"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  </div>
  <header>
    <a href="#" class="logo"><span>Le</span>PORTFOLIO<span>.</span></a>
    <nav>
      <a href="skill.html">SKILL</a>
      <a href="blog.html">BLOG</a>
      <a href="certification.html">CERTIFICATION</a>
      <a href="experience.html">EXPERIENCE</a>
    </nav>
  </header>
  <main>
    <section class="hero">
      <div class="hero-content">
        <h1 aria-label="TO BE A PIONEER">
          <span class="hero-line">TO</span>
          <span class="hero-line hero-line-white">BE A</span>
          <span class="hero-line">PIONEER</span>
        </h1>
        <p>人工知能・ソフトウェア開発を中心に、学んだことと制作したものを記録しています。</p>
        <a href="#profile" class="hero-button">PROFILEを見る <span>→</span></a>
      </div>
      <div class="hero-decoration" aria-hidden="true">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
      </div>
      <div class="scroll-line" aria-hidden="true"></div>
    </section>

    <section id="profile" class="profile">
      <div class="section-heading"><h2>PROFILE</h2></div>
      <div class="profile-box">
        <div class="profile-grid">
          <div class="profile-row">
            <div class="profile-label">名前</div>
            <div class="profile-value">稲　葉　玲　音</div>
          </div>
          <div class="profile-row">
            <div class="profile-label">年齢</div>
            <div class="profile-value">17</div>
          </div>
          <div class="profile-row">
            <div class="profile-label">学校</div>
            <div class="profile-value school-pair">
              <div class="school-ja">大阪公立大学工業高等専門学校<br>総合工学システム学科知能情報コース</div>
            </div>
          </div>
          <div class="profile-row">
            <div class="profile-label">部活動</div>
            <div class="profile-value">ラグビー部</div>
          </div>
        </div>
      </div>
    </section>

    <section id="contact" class="contact">
      <div class="section-heading"><h2>CONTACT</h2></div>
      <div class="contact-box">
        <p class="contact-copy">制作・開発に関するご連絡やお問い合わせは、GitHubよりお願いいたします。</p>
        <a class="contact-link" href="https://github.com/Le-1016" target="_blank" rel="noopener noreferrer">GitHubを見る <span>→</span></a>
      </div>
    </section>
  </main>
  <footer><div class="footer-line"></div></footer>

  <script>
    (() => {
      if (window.location.hash === '#activity') {
        window.location.replace('blog.html');
        return;
      }
      const profile = document.querySelector('.profile');
      if (!profile) return;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion || !('IntersectionObserver' in window)) {
        profile.classList.add('is-visible');
        return;
      }
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        });
      }, { threshold: 0.24, rootMargin: '0px 0px -8% 0px' });
      observer.observe(profile);
    })();
  </script>
</body>
</html>
