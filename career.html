<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAREER｜LEON INABA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700;800;900&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260903-0615">
  <link rel="stylesheet" href="japanese-theme.css?v=20260903-0615">
  <style>
    .career-page { min-height: 100vh; padding: 150px 7vw 120px; position: relative; z-index: 2; }
    .career-title { margin: 0 0 16px; color: var(--red); font-family: "Orbitron", sans-serif; font-size: clamp(48px, 7vw, 96px); font-weight: 800; letter-spacing: 0.08em; }
    .career-lead { max-width: 760px; margin: 0 0 90px; color: var(--white); line-height: 2; opacity: 0.8; }

    .timeline {
      --rail-x: 34px;
      position: relative;
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px 0 24px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: var(--rail-x);
      top: 0;
      bottom: 0;
      width: 5px;
      background: linear-gradient(to bottom, var(--red-bright), var(--red));
      box-shadow: 0 0 14px rgba(229,34,34,0.18);
      transform: translateX(-50%) scaleY(0);
      transform-origin: top;
      opacity: 0;
      transition: transform 1.1s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
    }

    .timeline.rail-visible::before {
      transform: translateX(-50%) scaleY(1);
      opacity: 1;
    }

    .timeline-item {
      position: relative;
      display: grid;
      grid-template-columns: 68px 170px minmax(0, 1fr);
      align-items: start;
      min-height: 165px;
      padding: 12px 0 36px;
    }

    .timeline-node {
      grid-column: 1;
      justify-self: center;
      position: relative;
      z-index: 2;
      width: 32px;
      height: 32px;
      margin-top: 5px;
      border: 0;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 14px rgba(229,34,34,0.18);
      opacity: 0;
      transform: scale(0.28);
      transition: opacity 0.3s ease, transform 0.72s cubic-bezier(0.18, 1.4, 0.36, 1), box-shadow 0.7s ease;
    }

    .timeline-phase {
      grid-column: 2;
      padding: 8px 18px 0 8px;
      color: var(--red);
      font-family: "Orbitron", sans-serif;
      font-size: clamp(16px, 1.7vw, 22px);
      font-weight: 700;
      letter-spacing: 0.05em;
      white-space: nowrap;
      opacity: 0;
      transform: translateX(-18px);
      transition: opacity 0.62s ease, transform 0.78s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .timeline-copy {
      grid-column: 3;
      padding: 0 0 0 18px;
      max-width: 800px;
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.68s ease 0.08s, transform 0.82s cubic-bezier(0.22, 1, 0.36, 1) 0.08s;
    }

    .timeline-copy h2 { margin: 0; color: var(--red); font-family: "Noto Serif JP", "Yu Mincho", "Hiragino Mincho ProN", serif; font-size: clamp(23px, 2.5vw, 34px); font-weight: 600; letter-spacing: 0.02em; line-height: 1.7; }

    .timeline-item.is-visible .timeline-node {
      opacity: 1;
      transform: scale(1);
      box-shadow: 0 0 20px rgba(229,34,34,0.24);
    }

    .timeline-item.is-visible .timeline-phase,
    .timeline-item.is-visible .timeline-copy {
      opacity: 1;
      transform: none;
    }

    nav a.active { color: var(--red-bright); text-shadow: 0 0 10px rgba(229,34,34,0.45); }
    header .logo { color: var(--white) !important; text-shadow: none !important; }
    header .logo span { color: var(--red) !important; }
    header nav a,
    header nav a.active { color: var(--white) !important; text-shadow: none !important; }
    header nav a:hover,
    header nav a.active:hover { color: var(--red-bright) !important; }

    @media (max-width: 760px) {
      .career-page { padding: 130px 7vw 90px; }
      .career-lead { margin-bottom: 58px; }
      .timeline { --rail-x: 20px; }
      .timeline::before { width: 4px; }
      .timeline-item { grid-template-columns: 40px 1fr; min-height: 0; padding: 0 0 58px; }
      .timeline-node { grid-column: 1; grid-row: 1 / span 2; width: 26px; height: 26px; margin-top: 2px; }
      .timeline-phase { grid-column: 2; padding: 0 0 8px 16px; font-size: 14px; }
      .timeline-copy { grid-column: 2; padding: 0 0 0 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .timeline::before,
      .timeline-node,
      .timeline-phase,
      .timeline-copy {
        transition: none;
        opacity: 1;
        transform: none;
      }
      .timeline::before { transform: translateX(-50%) scaleY(1); }
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true"><div class="grid"></div><div class="glow glow-1"></div><div class="glow glow-2"></div></div>
  <header>
    <a href="index.html" class="logo"><span>Le</span>PORTFOLIO<span>.</span></a>
    <nav>
      <a href="skill.html">SKILL</a>
      <a href="index.html#activity">BLOG</a>
      <a href="certification.html">CERTIFICATION</a>
      <a href="index.html#research">RESEARCH</a>
      <a href="career.html" class="active">CAREER</a>
    </nav>
  </header>
  <main class="career-page">
    <h1 class="career-title">CAREER</h1>
    <p class="career-lead">これまでの進学・在籍の記録を時系列でまとめています。</p>
    <div class="timeline">
      <section class="timeline-item"><div class="timeline-node" aria-hidden="true"></div><div class="timeline-phase">2025.03</div><div class="timeline-copy"><h2>大阪市立文の里中学校　卒業</h2></div></section>
      <section class="timeline-item"><div class="timeline-node" aria-hidden="true"></div><div class="timeline-phase">2025.04</div><div class="timeline-copy"><h2>大阪公立大学工業高等専門学校<br>総合工学システム学科　入学</h2></div></section>
      <section class="timeline-item"><div class="timeline-node" aria-hidden="true"></div><div class="timeline-phase">2026.03</div><div class="timeline-copy"><h2>１年次　修了</h2></div></section>
      <section class="timeline-item"><div class="timeline-node" aria-hidden="true"></div><div class="timeline-phase">2026.04</div><div class="timeline-copy"><h2>２年 知能情報コース　配属</h2></div></section>
    </div>
  </main>

  <script>
    (() => {
      const timeline = document.querySelector('.timeline');
      const items = [...document.querySelectorAll('.timeline-item')];
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (reduceMotion || !('IntersectionObserver' in window)) {
        timeline.classList.add('rail-visible');
        items.forEach((item) => item.classList.add('is-visible'));
        return;
      }

      const railObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          timeline.classList.add('rail-visible');
          railObserver.disconnect();
        });
      }, { threshold: 0.08 });

      const itemObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add('is-visible');
          itemObserver.unobserve(entry.target);
        });
      }, {
        threshold: 0.32,
        rootMargin: '0px 0px -8% 0px'
      });

      railObserver.observe(timeline);
      items.forEach((item) => itemObserver.observe(item));
    })();
  </script>
</body>
</html>
